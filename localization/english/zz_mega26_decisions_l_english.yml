l_english:
 mega26_proclaim_great_mongolian_state: "Proclaim the Great Mongolian State"
 mega26_proclaim_great_mongolian_state_desc: "Our empire rose from the steppe. Restore the name of the Great Mongolian State, keeping our Mongol, Han and Manchu peoples and our Confucian faith."
 mega26_proclaim_ottoman_caliphate: "Proclaim the Caliphate"
 mega26_proclaim_ottoman_caliphate_desc: "The House of Osman has carried the banner of the faithful from Thrace to India. Let the world know us as the Ottoman Caliphate."
 mega26_proclaim_empire_of_great_japan: "Proclaim the Empire of Great Japan"
 mega26_proclaim_empire_of_great_japan_desc: "From Kyushu to the Korean peninsula and beyond, the islands answer to one throne. Let the world know us as the Empire of Great Japan."
